# scripts/check.conf — the steps behind ./scripts/check (format: scripts/check.conf.example).
# Generated at bootstrap 2026-11-07. GREENFIELD: rule 1 (no spec, no code) forbids the code these
# steps need, so every step below is a PLANNED step, kept as a comment. The walking skeleton
# (first spec) creates the toolchain, uncomments them, and runs the residue test (fast + full).
#
# Planned interpreter: PY = the project venv's Python 3.13 — .venv/Scripts/python.exe on Windows,
# .venv/bin/python on Linux CI. Never the bare `python` (this machine also has 3.7 — Known traps).
# The walking skeleton picks the one portable form (e.g. a tiny scripts/py shim) and writes it in.
#
# --- Resource hygiene inventory (docs/testing.md, Resource hygiene) ---
# ruff          one-shot, no server/daemon; leaves .ruff_cache (cache only, not run data)
# mypy          one-shot; never dmypy (daemon) — # resource hygiene: no type-check daemon
# lint-imports  one-shot; --no-cache so no state carries between runs
# pytest        in-process TestClient, NO uvicorn server started; no pytest-xdist workers;
#               -p no:cacheprovider (no run state carried over); each test its own tmp_path SQLite
#               (data rule 5: a run never sees the previous run's rows, also after a kill)
# node --test   child process per test file, all exit with the runner; no watch mode
# pip-audit     audits the installed venv (no temp venv); network only, full profile only
# None of them needs a stop step; the skeleton's residue test proves it.
#
# --- Planned prerequisites ---
# requires lint: PY -c "import sys; sys.exit(0 if sys.version_info[:2] == (3, 13) else 1)"
# requires web-test: node -e "process.exit(+process.versions.node.split('.')[0] >= 20 ? 0 : 1)"
# requires audit: PY -c "import urllib.request; urllib.request.urlopen('https://pypi.org/simple/', timeout=5)"
#
# --- Planned steps (fast = [fast]; full = all) ---
# lint [fast]: PY -m ruff check .
# format [fast]: PY -m ruff format --check .
# types [fast]: PY -m mypy app
# architecture [fast]: PY -m importlinter.cli lint-imports --no-cache
# unit [fast]: env TZ=UTC PY -m pytest -q -p no:cacheprovider --strict-markers -m "not integration"
# web-test [fast]: node --test web/tests/
# integration: env TZ=UTC PY -m pytest -q -p no:cacheprovider --strict-markers -m integration
# audit: PY -m pip_audit --strict
#
# Selector split (Two speeds rule 4): unit = -m "not integration", integration = -m integration,
# so every pytest test lands in exactly one profile by construction.
