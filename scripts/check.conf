# scripts/check.conf — the steps behind ./scripts/check (format: scripts/check.conf.example).
# Generated at bootstrap 2026-11-07; activated by spec 0001 (walking skeleton).
#
# Interpreter: ./scripts/py = the project venv's Python 3.13 (.venv/Scripts/python.exe on Windows,
# .venv/bin/python on Linux CI). Never the bare `python` (this machine also has 3.7 — Known traps).
#
# --- Resource hygiene inventory (docs/testing.md, Resource hygiene) ---
# ruff          one-shot, no server/daemon; leaves .ruff_cache (cache only, not run data)
# mypy          one-shot; never dmypy (daemon) — # resource hygiene: no type-check daemon
# lint-imports  one-shot; --no-cache so no state carries between runs
# pytest        in-process TestClient; the one real server (tests/integration/test_startup.py) is
#               terminated in the test's finally; no pytest-xdist workers;
#               -p no:cacheprovider (no run state carried over); each test its own tmp_path SQLite
#               (data rule 5: a run never sees the previous run's rows, also after a kill)
# node --test   child process per test file, all exit with the runner; no watch mode
# pip-audit     audits the installed venv (no temp venv); network only, full profile only
# None of them needs a stop step; the residue test proves it (fast + full).
#
# --- Prerequisites (exit 0 = this machine can run the step; side-effect free) ---
requires lint: ./scripts/py -c "import sys; sys.exit(0 if sys.version_info[:2] == (3, 13) else 1)"
requires web-test: node -e "process.exit(+process.versions.node.split('.')[0] >= 20 ? 0 : 1)"
requires audit: ./scripts/py -c "import urllib.request; urllib.request.urlopen('https://pypi.org/simple/', timeout=5)"
#
# --- Steps (fast = [fast]; full = all) ---
lint [fast]: ./scripts/py -m ruff check .
format [fast]: ./scripts/py -m ruff format --check .
types [fast]: ./scripts/py -m mypy
architecture [fast]: ./scripts/py -c "import sys; from importlinter.cli import lint_imports_command; sys.exit(lint_imports_command())" --no-cache
unit [fast]: env TZ=UTC ./scripts/py -m pytest -q -p no:cacheprovider -m "not integration"
web-test [fast]: node --test "web/tests/*.test.js"
integration: env TZ=UTC ./scripts/py -m pytest -q -p no:cacheprovider -m integration
audit: ./scripts/py -m pip_audit --strict
#
# Selector split (Two speeds rule 4): unit = -m "not integration", integration = -m integration,
# so every pytest test lands in exactly one profile by construction (--strict-markers in
# pyproject.toml catches a misspelt marker).
